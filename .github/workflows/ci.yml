name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  KCC_TARGET_USER_ID: '1234567890'

jobs:
  quality:
    name: Lint, unit tests, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install reproducibly
        run: yarn install --frozen-lockfile --non-interactive
      - run: yarn test:ci
      - name: Upload executable for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koii-task-executable
          path: dist/main.js
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - run: yarn audit:production

  container:
    name: Hardened container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --build-arg KCC_TARGET_USER_ID="$KCC_TARGET_USER_ID" --target runtime --tag keep-crypto-clean:ci .
      - name: Verify non-root image user
        run: test "$(docker image inspect --format '{{.Config.User}}' keep-crypto-clean:ci)" = node
      - name: Smoke health endpoint
        run: |
          docker run --detach --name keep-crypto-clean-ci \
            --publish 127.0.0.1:3000:3000 \
            --env X_API_BEARER_TOKEN=ci-placeholder-not-a-token \
            keep-crypto-clean:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs keep-crypto-clean-ci
          exit 1
