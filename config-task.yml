# Keep this configuration on TEST until the release checklist in
# docs/RELEASE.md has been completed against a real Koii test task.
task_name: 'KeepCryptoClean Observer'
author: 'Madan Chaolla Park and contributors'
description: 'A safe-by-default Koii task that records and audits one live Post-ID/target-author attestation per round through the official X API. Public proofs contain only Post IDs, User IDs, and Koii task metadata; they do not claim novelty, freshness, or timeline completeness, and posting is disabled.'
repositoryUrl: 'https://github.com/MadanChaollaPark/KeepCryptoClean'
imageUrl: 'https://opengraph.githubassets.com/keepcryptoclean/MadanChaollaPark/KeepCryptoClean'
infoUrl: 'https://github.com/MadanChaollaPark/KeepCryptoClean#readme'
# Privacy policy: https://github.com/MadanChaollaPark/KeepCryptoClean/blob/main/PRIVACY.md

task_executable_network: 'IPFS'
task_audit_program: 'dist/main.js'

# One slot is approximately 408 ms. Windows leave a separate distribution
# period and must be changed only through a reviewed task migration.
round_time: 33500
audit_window: 11500
submission_window: 11500

minimum_stake_amount: 1.9
total_bounty_amount: 10
bounty_amount_per_round: 0.1
allowed_failed_distributions: 3
space: 5

requirementsTags:
  - type: TASK_VARIABLE
    value: 'X_API_BEARER_TOKEN'
    description: 'A read-only X API bearer token. Do not configure user credentials or browser sessions.'
  - type: CPU
    value: '2-core'
  - type: RAM
    value: '2 GB'
  - type: STORAGE
    value: '1 GB'

task_type: 'KOII'
environment: 'TEST'

################################ UPDATE TASK ONLY ################################
task_id: ''
migrationDescription: '3.0 safe observer-mode redesign; browser posting removed from the production profile.'
