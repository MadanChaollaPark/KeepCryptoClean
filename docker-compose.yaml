name: keep-crypto-clean

services:
  observer:
    build:
      context: .
      target: runtime
    image: keep-crypto-clean:local
    init: true
    restart: unless-stopped
    read_only: true
    user: '1000:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      NODE_ENV: production
      EXPRESS_PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      X_API_BEARER_TOKEN: ${X_API_BEARER_TOKEN:-}
      X_TARGET_USER_ID: ${X_TARGET_USER_ID:-}
    ports:
      - '127.0.0.1:${TASK_HTTP_PORT:-3000}:3000'
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - task_runtime:/app/runtime

volumes:
  task_runtime:
